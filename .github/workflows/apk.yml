name: APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi ve Fontlari Hazirla
        run: |
          mkdir -p /tmp/lib_yedek
          cp -r lib/* /tmp/lib_yedek/
          flutter create --org com.omovation --project-name risale_vecize .
          rm -rf lib/*
          cp -r /tmp/lib_yedek/* lib/
          if [ -f lib/ana.dart ]; then mv lib/ana.dart lib/main.dart; fi

          mkdir -p assets/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" -o assets/fonts/Amiri-Regular.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o assets/fonts/Amiri-Bold.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" -o assets/fonts/Lora.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o assets/fonts/Playfair.ttf

          cat << 'EOF' > pubspec.yaml
          name: risale_vecize
          description: Risale-i Nur Vecize Uygulamasi
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_local_notifications: ^17.2.2
            timezone: ^0.9.4
            flutter_timezone: ^3.0.1
            shared_preferences: ^2.3.2
            share_plus: ^10.0.2
            path_provider: ^2.1.4

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            fonts:
              - family: MushafFont
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
              - family: KitapSerif
                fonts:
                  - asset: assets/fonts/Lora.ttf
              - family: HatBaslik
                fonts:
                  - asset: assets/fonts/Playfair.ttf
          EOF

      - name: Hu Bildirim Sesi Olustur
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - << 'EOF'
          import wave, struct, math, random

          sample_rate = 44100
          duration = 2.6
          num_samples = int(sample_rate * duration)

          with wave.open('android/app/src/main/res/raw/hu_sesi.wav', 'w') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              for i in range(num_samples):
                  t = i / sample_rate
                  env = math.sin(math.pi * min(t / 0.55, 1.0)) if t < 0.55 else math.exp(-(t - 0.55) * 1.65)
                  f0 = 146.83 * (1.0 + 0.004 * math.sin(2 * math.pi * 4.2 * t))
                  s = (
                      0.55 * math.sin(2 * math.pi * f0 * t) +
                      0.25 * math.sin(2 * math.pi * f0 * 2 * t) +
                      0.10 * math.sin(2 * math.pi * f0 * 3 * t) +
                      0.03 * (random.random() * 2 - 1) * math.exp(-t * 2.5)
                  )
                  val = int(max(-32767, min(32767, s * env * 24000)))
                  wav.writeframes(struct.pack('<h', val))
          EOF

      - name: Android Izinleri ve Alarm Ayarlari
        run: |
          python3 - << 'EOF'
          import os

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()

          perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
          """
          if "SCHEDULE_EXACT_ALARM" not in xml:
              xml = xml.replace("<application", perms + "\n    <application", 1)

          receivers = """
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationReceiver" not in xml:
              xml = xml.replace("</application>", receivers + "\n    </application>", 1)

          with open(path, "w") as f:
              f.write(xml)

          gradle_props = "android/gradle.properties"
          if os.path.exists(gradle_props):
              with open(gradle_props, "r") as f:
                  props = f.read()
              if "kotlin.jvm.target.validation.mode" not in props:
                  with open(gradle_props, "w") as f:
                      f.write(props + "\nkotlin.jvm.target.validation.mode=warning\n")

          root_kts = "android/build.gradle.kts"
          if os.path.exists(root_kts):
              with open(root_kts, "r") as f:
                  content = f.read()
              jvm_fix = """
          gradle.projectsEvaluated {
              subprojects {
                  tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile>().configureEach {
                      compilerOptions {
                          jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      }
                  }
              }
          }
          """
              with open(root_kts, "w") as f:
                  f.write(content + "\n" + jvm_fix)

          app_kts = "android/app/build.gradle.kts"
          if os.path.exists(app_kts):
              with open(app_kts, "r") as f:
                  app_content = f.read()
              if "isCoreLibraryDesugaringEnabled" not in app_content:
                  app_content = app_content.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )
                  app_content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  with open(app_kts, "w") as f:
                      f.write(app_content)
          EOF

      - name: APK Derle
        run: |
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasini Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Risale-i-Nur-Vecize-APK
          path: build/app/outputs/flutter-apk/app-release.apk
