name: APK Uret

on:
  push:
    branches: [ "ana", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: olustur
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi ve Ikonu Hazirla
        run: |
          flutter create --org com.omovation --project-name risale_vecize app_build
          cp lib/*.dart app_build/lib/
          if [ -f app_build/lib/ana.dart ]; then mv app_build/lib/ana.dart app_build/lib/main.dart; fi
          cd app_build
          flutter pub add flutter_local_notifications share_plus shared_preferences timezone path_provider

          ICON_FILE=$(find .. -maxdepth 2 -not -path "../app_build*" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            mkdir -p assets
            EXT="${ICON_FILE##*.}"
            cp "$ICON_FILE" "assets/icon.$EXT"
            flutter pub add --dev flutter_launcher_icons
            printf '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.%s"\n  adaptive_icon_background: "#14532D"\n  adaptive_icon_foreground: "assets/icon.%s"\n' "$EXT" "$EXT" >> pubspec.yaml
            dart run flutter_launcher_icons
          fi

          mkdir -p assets/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" -o assets/fonts/Amiri-Regular.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o assets/fonts/Amiri-Bold.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" -o assets/fonts/Lora.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o assets/fonts/Playfair.ttf

          python3 - << 'EOF'
          import os, re

          with open("pubspec.yaml", "r") as f:
              pub = f.read()

          fonts_block = """uses-material-design: true
            fonts:
              - family: MushafFont
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
              - family: KitapSerif
                fonts:
                  - asset: assets/fonts/Lora.ttf
              - family: HatBaslik
                fonts:
                  - asset: assets/fonts/Playfair.ttf"""

          if "MushafFont" not in pub:
              pub = pub.replace("uses-material-design: true", fonts_block, 1)
              with open("pubspec.yaml", "w") as f:
                  f.write(pub)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()

          perms = """    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
          """
          receivers = """        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """
          if "POST_NOTIFICATIONS" not in m:
              m = m.replace("<application", perms + "    <application", 1)
          if "ScheduledNotificationReceiver" not in m:
              m = m.replace("</application>", receivers + "    </application>", 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="Risale-i Nur Vecize"', m, count=1)
          with open(manifest_path, "w") as f:
              f.write(m)

          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  g = f.read()
              g = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 37', g, count=1)
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              with open(kts_path, "w") as f:
                  f.write(g)
          EOF

      - name: APK derle
        working-directory: app_build
        run: flutter build apk --release

      - name: APK dosyasini hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Risale-Vecize-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
# --- APK YML BİTTİ ---

